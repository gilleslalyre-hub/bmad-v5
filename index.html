<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMAD Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* Palette — light, neutral, professional */
  --bg:       #F1F3F6;
  --surface:  #FFFFFF;
  --surface2: #F8F9FB;
  --border:   #E4E7EC;
  --border2:  #CDD2DC;
  --text:     #0F1723;
  --text2:    #64748B;
  --text3:    #94A3B8;

  /* Agent accent colors — distinct, accessible */
  --mary:         #2563EB;   /* Discovery  — Blue     */
  --mary-soft:    #EFF6FF;
  --mary-mid:     #BFDBFE;
  --john:         #7C3AED;   /* PM         — Violet   */
  --john-soft:    #F5F3FF;
  --john-mid:     #DDD6FE;
  --sally:        #059669;   /* UX         — Emerald  */
  --sally-soft:   #ECFDF5;
  --sally-mid:    #A7F3D0;
  --winston:      #D97706;   /* Architect  — Amber    */
  --winston-soft: #FFFBEB;
  --winston-mid:  #FDE68A;
  --party:        #E8430A;   /* Party      — Orange   */
  --party-soft:   #FEF3EF;
  --party-mid:    #FDDBC9;

  /* UI accent — neutral indigo for interactive elements */
  --accent:       #4F46E5;
  --accent-soft:  #EEF2FF;
  --accent-mid:   #C7D2FE;

  --radius:    10px;
  --radius-sm: 6px;
  --shadow:    0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,.08), 0 2px 4px rgba(0,0,0,.04);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Geist', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  font-size: 13px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

/* ── MODAL ──────────────────────────────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(17,24,39,.45);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000;
  backdrop-filter: blur(4px);
}
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 36px 32px;
  width: 400px;
  box-shadow: var(--shadow-md);
}
.modal-logo {
  width: 44px; height: 44px;
  background: var(--accent);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
  margin-bottom: 20px;
}
.modal h2 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
.modal p { color: var(--text2); font-size: 13px; line-height: 1.6; margin-bottom: 24px; }
.modal-label {
  display: block;
  font-size: 11px; font-weight: 600; color: var(--text2);
  text-transform: uppercase; letter-spacing: .06em;
  margin-bottom: 6px;
}
.modal input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 10px 12px;
  color: var(--text);
  font-family: 'Geist Mono', monospace;
  font-size: 12px;
  outline: none;
  margin-bottom: 14px;
  transition: border-color .15s;
}
.modal input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.modal-btn {
  width: 100%;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius-sm);
  padding: 10px;
  font-family: 'Geist', sans-serif;
  font-size: 13px; font-weight: 600;
  cursor: pointer;
  transition: opacity .15s;
}
.modal-btn:hover { opacity: .88; }
.modal-note { margin-top: 10px; font-size: 11px; color: var(--text3); text-align: center; }

/* ── TOPBAR ─────────────────────────────────────────────────────────── */
.topbar {
  height: 52px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 20px;
  gap: 0;
  flex-shrink: 0;
}
.logo {
  display: flex; align-items: center; gap: 9px;
  flex-shrink: 0;
  padding-right: 20px;
  border-right: 1px solid var(--border);
  margin-right: 20px;
}
.logo-mark {
  width: 26px; height: 26px;
  background: var(--accent);
  border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px;
}
.logo-text { font-size: 13px; font-weight: 600; color: var(--text); }
.logo-text span { color: var(--text3); font-weight: 400; }

/* Phase breadcrumb */
.phase-nav {
  display: flex; align-items: center; gap: 2px;
  flex: 1;
}
.phase-item {
  display: flex; align-items: center; gap: 6px;
  padding: 5px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 12px; font-weight: 500;
  color: var(--text3);
  transition: all .15s;
  user-select: none;
}
.phase-item:hover { color: var(--text2); background: var(--surface2); }
.phase-item.active { color: var(--text); background: var(--surface2); }
.phase-num {
  width: 18px; height: 18px;
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700;
  background: var(--border);
  color: var(--text3);
  flex-shrink: 0;
}
.phase-item.active .phase-num {
  background: var(--agent-color, var(--mary));
  color: #fff;
}
.phase-arrow { color: var(--border2); font-size: 16px; padding: 0 1px; }

.tb-right {
  display: flex; align-items: center; gap: 8px;
  margin-left: auto;
  flex-shrink: 0;
}
.model-badge {
  display: flex; align-items: center; gap: 5px;
  padding: 5px 10px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  font-size: 11px; color: var(--text2);
}
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: #22C55E; }

/* ── LAYOUT ─────────────────────────────────────────────────────────── */
.layout {
  display: grid;
  grid-template-columns: 256px 1fr 300px;
  flex: 1;
  overflow: hidden;
  gap: 0;
}

/* ── SIDEBAR (left) ─────────────────────────────────────────────────── */
.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Agent header card */
.sidebar-agent-header {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.agent-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.agent-avatar {
  width: 36px; height: 36px;
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
  border: 1px solid var(--border);
  flex-shrink: 0;
  transition: all .2s;
}
.agent-info { flex: 1; min-width: 0; }
.agent-name { font-size: 13px; font-weight: 600; color: var(--text); }
.agent-role { font-size: 11px; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agent-phase-pill {
  font-size: 10px; font-weight: 600;
  padding: 3px 8px;
  border-radius: 20px;
  background: var(--surface2);
  color: var(--text3);
  border: 1px solid var(--border);
  flex-shrink: 0;
}

/* Commands list */
.cmds-area { flex: 1; overflow-y: auto; }
.cmds-area::-webkit-scrollbar { width: 3px; }
.cmds-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.cmd-section {
  padding: 14px 16px 4px;
}
.cmd-section-title {
  font-size: 10px;
  font-weight: 700;
  color: var(--text3);
  text-transform: uppercase;
  letter-spacing: .07em;
  margin-bottom: 6px;
  padding: 0 2px;
}
.cmd-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px 10px;
  border-radius: var(--radius-sm);
  border: none;
  background: transparent;
  cursor: pointer;
  text-align: left;
  transition: background .1s;
  margin-bottom: 1px;
}
.cmd-btn:hover { background: var(--surface2); }
.cmd-btn.primary-cmd {
  background: var(--agent-bg, var(--mary-soft));
  border: 1px solid var(--agent-border, var(--mary-mid));
}
.cmd-btn.primary-cmd:hover { opacity: .85; }
.cmd-icon { font-size: 14px; width: 20px; text-align: center; flex-shrink: 0; }
.cmd-body { flex: 1; min-width: 0; }
.cmd-label { font-size: 12px; font-weight: 500; color: var(--text); display: block; }
.cmd-slash { font-size: 10px; color: var(--text3); font-family: 'Geist Mono', monospace; display: block; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmd-btn.dim { opacity: .45; }

.cmd-sep { height: 1px; background: var(--border); margin: 8px 16px; }

/* Agent switcher */
.sidebar-bottom {
  border-top: 1px solid var(--border);
  padding: 10px 8px;
  flex-shrink: 0;
}
.sidebar-bottom-title {
  font-size: 10px; font-weight: 700; color: var(--text3);
  text-transform: uppercase; letter-spacing: .07em;
  padding: 2px 8px 6px;
}
.agent-mini {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 8px;
  border-radius: var(--radius-sm);
  cursor: pointer; border: none; background: transparent; width: 100%; text-align: left;
  transition: background .1s;
}
.agent-mini:hover { background: var(--surface2); }
.agent-mini.active { background: var(--surface2); }
.agent-mini-emoji {
  width: 24px; height: 24px;
  border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px;
  border: 1px solid var(--border);
  flex-shrink: 0;
}
.agent-mini-name { font-size: 12px; font-weight: 500; color: var(--text2); }
.agent-mini.active .agent-mini-name { color: var(--text); }
.agent-mini-check { margin-left: auto; font-size: 11px; color: var(--john); opacity: 0; }
.agent-mini.active .agent-mini-check { opacity: 1; }
.agent-mini-done {
  margin-left: auto;
  width: 14px; height: 14px;
  border-radius: 50%;
  background: var(--winston-soft);
  border: 1px solid var(--winston-mid);
  display: none;
  align-items: center; justify-content: center;
  font-size: 8px; color: var(--winston);
}

/* ── CHAT ───────────────────────────────────────────────────────────── */
.chat-area {
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--bg);
}

.chat-header {
  height: 52px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 20px; gap: 10px;
  flex-shrink: 0;
}
.chat-hdr-avatar {
  width: 30px; height: 30px;
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px;
  border: 1px solid var(--border);
  flex-shrink: 0;
}
.chat-hdr-name { font-size: 13px; font-weight: 600; }
.chat-hdr-desc { font-size: 12px; color: var(--text3); flex: 1; }
.chat-hdr-tag {
  font-size: 10px; font-weight: 600;
  padding: 3px 8px;
  border-radius: 20px;
  background: var(--accent-soft);
  color: var(--accent);
  border: 1px solid var(--accent-mid);
  letter-spacing: .04em;
}

.messages {
  flex: 1; overflow-y: auto;
  padding: 24px 20px;
  display: flex; flex-direction: column; gap: 14px;
}
.messages::-webkit-scrollbar { width: 4px; }
.messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

/* Welcome screen */
.welcome {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; height: 100%; text-align: center;
  gap: 14px; padding: 40px;
}
.welcome-avatar {
  width: 56px; height: 56px;
  border-radius: 14px;
  display: flex; align-items: center; justify-content: center;
  font-size: 26px; border: 1px solid var(--border);
}
.welcome h2 { font-size: 17px; font-weight: 600; }
.welcome p { font-size: 13px; color: var(--text2); max-width: 340px; line-height: 1.6; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 4px; }
.chip {
  padding: 6px 12px;
  border-radius: var(--radius-sm);
  background: var(--surface);
  border: 1px solid var(--border2);
  font-size: 11px; cursor: pointer;
  transition: all .15s;
  font-family: 'Geist Mono', monospace;
  color: var(--text2);
  box-shadow: var(--shadow);
}
.chip:hover { background: var(--surface2); border-color: var(--border2); color: var(--text); }

/* Messages */
.msg { display: flex; gap: 10px; max-width: 680px; }
.msg.user { flex-direction: row-reverse; margin-left: auto; }
.msg-avatar {
  width: 28px; height: 28px;
  border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; flex-shrink: 0;
  border: 1px solid var(--border);
  background: var(--surface);
}
.msg-body { display: flex; flex-direction: column; gap: 3px; }
.msg-name { font-size: 10px; font-weight: 600; color: var(--text3); }
.msg.user .msg-name { text-align: right; }
.msg-text {
  padding: 10px 13px;
  border-radius: 10px;
  font-size: 13px; line-height: 1.6;
}
.msg.agent .msg-text {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 2px 10px 10px 10px;
  box-shadow: var(--shadow);
}
.msg.user .msg-text {
  background: var(--accent);
  color: #fff;
  border-radius: 10px 2px 10px 10px;
}

/* Typing indicator */
.typing-row { display: flex; gap: 10px; align-items: flex-start; }
.typing {
  display: flex; gap: 4px;
  padding: 12px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 2px 10px 10px 10px;
  width: fit-content;
  box-shadow: var(--shadow);
}
.typing span {
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--text3);
  animation: bounce .9s infinite;
}
.typing span:nth-child(2) { animation-delay: .15s; }
.typing span:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%,80%,100%{transform:translateY(0);}40%{transform:translateY(-5px);} }

/* Input zone */
.input-zone {
  padding: 12px 16px 14px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  flex-shrink: 0;
  position: relative;
}
.input-inner {
  display: flex; align-items: flex-end; gap: 8px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 9px 12px;
  transition: border-color .15s, box-shadow .15s;
}
.input-inner:focus-within {
  border-color: var(--agent-accent, var(--john));
  box-shadow: 0 0 0 3px var(--agent-accent-soft, var(--john-soft));
}
.slash-btn {
  font-size: 13px; font-weight: 600;
  font-family: 'Geist Mono', monospace;
  color: var(--text3);
  cursor: pointer; flex-shrink: 0;
  padding: 1px 6px 1px 0;
  border-right: 1px solid var(--border);
  margin-right: 4px;
  transition: color .15s;
  user-select: none;
}
.slash-btn:hover { color: var(--agent-accent, var(--john)); }
#userInput {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--text); font-family: 'Geist', sans-serif;
  font-size: 13px; resize: none;
  min-height: 22px; max-height: 160px; line-height: 1.5;
}
#userInput::placeholder { color: var(--text3); }
#sendBtn {
  width: 28px; height: 28px;
  background: var(--agent-accent, var(--john));
  border: none; border-radius: var(--radius-sm);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: #fff;
  transition: opacity .15s; flex-shrink: 0;
}
#sendBtn:hover { opacity: .85; }
#sendBtn:disabled { opacity: .3; cursor: not-allowed; }

/* Autocomplete */
.autocomplete {
  position: absolute;
  bottom: calc(100% + 4px);
  left: 16px; right: 16px;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  overflow: hidden;
  display: none;
  max-height: 260px; overflow-y: auto;
  z-index: 100;
  box-shadow: var(--shadow-md);
}
.autocomplete.show { display: block; }
.ac-header {
  padding: 8px 12px;
  font-size: 10px; font-weight: 700; color: var(--text3);
  text-transform: uppercase; letter-spacing: .07em;
  border-bottom: 1px solid var(--border);
  background: var(--surface2);
}
.ac-item {
  display: flex; align-items: center; gap: 10px;
  padding: 9px 12px; cursor: pointer;
  transition: background .1s;
  border-bottom: 1px solid var(--border);
}
.ac-item:last-child { border-bottom: none; }
.ac-item:hover, .ac-item.sel { background: var(--accent-soft); }
.ac-cmd { font-family: 'Geist Mono', monospace; font-size: 11px; color: var(--john); font-weight: 500; }
.ac-desc { font-size: 11px; color: var(--text3); flex: 1; }
.ac-tag {
  font-size: 10px; padding: 1px 6px;
  border-radius: 8px;
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text3);
}

/* ── SIDEBAR SEARCH ─────────────────────────────────────────────────── */
.sidebar-search {
  padding: 12px 12px 8px;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border);
}
.search-inner {
  display: flex; align-items: center; gap: 7px;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 7px 10px;
  transition: border-color .15s, box-shadow .15s;
}
.search-inner:focus-within {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.search-icon { font-size: 13px; color: var(--text3); flex-shrink: 0; user-select: none; }
.search-inner input {
  flex: 1; background: transparent; border: none; outline: none;
  font-family: 'Geist', sans-serif; font-size: 12px; color: var(--text);
}
.search-inner input::placeholder { color: var(--text3); }

/* ── CMD GROUP HEADER ────────────────────────────────────────────────── */
.cmd-group-header {
  display: flex; align-items: center; gap: 6px;
  padding: 0 2px; margin-bottom: 4px;
}
.cmd-group-dot {
  width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0;
}

/* ── PANEL (right) ──────────────────────────────────────────────────── */
.panel {
  background: var(--surface);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
.panel-header {
  height: 52px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 16px; gap: 8px;
  flex-shrink: 0;
}
.panel-title { font-size: 13px; font-weight: 600; flex: 1; }
.panel-actions { display: flex; gap: 4px; }
.panel-btn {
  padding: 5px 9px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 11px; font-weight: 500;
  color: var(--text2); cursor: pointer;
  transition: all .1s;
  font-family: 'Geist', sans-serif;
}
.panel-btn:hover { background: var(--border); color: var(--text); }
.panel-content { flex: 1; overflow-y: auto; padding: 16px; }
.panel-content::-webkit-scrollbar { width: 3px; }
.panel-content::-webkit-scrollbar-thumb { background: var(--border); }
.panel-empty {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  height: 100%; gap: 10px; color: var(--text3);
  text-align: center;
}
.panel-empty-icon { font-size: 28px; opacity: .5; }
.panel-empty-title { font-size: 13px; font-weight: 500; }
.panel-empty-desc { font-size: 11px; max-width: 180px; line-height: 1.6; }

/* Livrable rendering */
.lv-h1 { font-size: 14px; font-weight: 700; color: var(--text); margin: 14px 0 6px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
.lv-h1:first-child { margin-top: 0; }
.lv-h2 { font-size: 10px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: .07em; margin: 12px 0 5px; }
.lv-p { font-size: 12px; color: var(--text2); line-height: 1.6; margin-bottom: 3px; }
.lv-bullet { font-size: 12px; color: var(--text2); line-height: 1.5; padding-left: 12px; position: relative; margin-bottom: 2px; }
.lv-bullet::before { content: "·"; position: absolute; left: 0; color: var(--text3); }
</style>
</head>
<body>

<!-- API key managed server-side -->

<!-- ── TOPBAR ── -->
<div class="topbar">
  <div class="logo">
    <div class="logo-mark">⚡</div>
    <div class="logo-text">BMAD Studio</div>
  </div>
  <div class="tb-right">
    <div class="model-badge"><div class="status-dot"></div>claude-sonnet-4</div>
  </div>
</div>

<!-- ── LAYOUT ── -->
<div class="layout">

  <!-- LEFT SIDEBAR -->
  <div class="sidebar">

    <!-- Search -->
    <div class="sidebar-search">
      <div class="search-inner">
        <span class="search-icon">⌕</span>
        <input type="text" id="cmdSearch" placeholder="Rechercher une commande…" oninput="filterCmds(this.value)" autocomplete="off">
      </div>
    </div>

    <!-- Commands grouped by phase -->
    <div class="cmds-area" id="cmdsList"></div>
  </div>

  <!-- CHAT -->
  <div class="chat-area">
    <div class="chat-header">
      <div class="chat-hdr-avatar" id="chatCtxAvatar" style="background:var(--accent-soft)">⚡</div>
      <div class="chat-hdr-name" id="chatCtxName">BMAD Studio</div>
      <div class="chat-hdr-desc" id="chatCtxDesc">Assistant produit · Multi-phases</div>
      <div class="chat-hdr-tag">BMAD</div>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-zone">
      <div class="autocomplete" id="autocomplete"></div>
      <div class="input-inner">
        <span class="slash-btn" onclick="toggleSlashMenu()" title="Commandes BMAD">/</span>
        <textarea id="userInput" rows="1"
          placeholder="Message ou /commande-bmad…"
          onkeydown="handleKey(event)"
          oninput="autoResize(this);handleAutocomplete(this.value)"></textarea>
        <button id="sendBtn" onclick="sendMessage()">↑</button>
      </div>
    </div>
  </div>

  <!-- PANEL -->
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title" id="panelTitle">Livrable</div>
      <div class="panel-actions">
<button class="panel-btn" onclick="copyLivrable()">Copier</button>
        <button class="panel-btn" onclick="exportTxt()">↓ TXT</button>
        <button class="panel-btn" onclick="exportPdf()">↓ PDF</button>
        <button class="panel-btn" onclick="clearLivrable()">✕</button>
      </div>
    </div>
    <div class="panel-content" id="panelContent"></div>
  </div>

</div>

<script>
let isLoading = false;
let conversation = [];
const livrables = { brief:'', prd:'', ux:'', architecture:'', last:'' };

// ── SYSTEM PROMPT UNIFIÉ ──────────────────────────────────────────────
const SYSTEM_PROMPT = `Tu es BMAD Studio — un assistant produit expert en méthode agile AI-driven. Tu t'exprimes uniquement en français. Tu maîtrises tous les rôles du cycle produit.

COMMANDES BMAD — adopte le persona et le flow correspondant :

/bmad-bmm-create-product-brief → [Mary — Business Analyst Senior] Flow Discovery (6 questions min, UNE à la fois). Livrable final : # Product Brief avec sections Problème core, Utilisateurs cibles, Contexte marché, Hypothèses clés, Définition du succès, Contraintes & risques, Différenciateur clé, Recommandation de priorisation.

/bmad-bmm-create-prd → [John — Product Manager Senior] Flow PRD (4-5 questions). Livrable final : # PRD avec sections Contexte & objectifs, Métriques de succès (tableau), Périmètre V1 (In/Out scope), User Stories MoSCoW avec critères d'acceptance, Hypothèses & risques (tableau), Jalons & dépendances, Questions ouvertes.

/bmad-bmm-create-ux-design → [Sally — UX Designer Senior] Flow UX (4-5 questions). Livrable final : # Design UX avec sections Personas & contextes d'usage, Parcours AS-IS avec frictions, Parcours TO-BE (schéma ASCII), Principes de design, Composants & patterns UX, Cas limites & erreurs, Métriques UX de succès.

/bmad-bmm-create-architecture → [Winston — Architecte Technique Senior] Flow architecture (4-5 questions). Livrable final : # Architecture Technique avec sections Vue d'ensemble, Schéma ASCII, Stack technique justifié, ADR (Architecture Decision Records), NFR, Sécurité & conformité, Plan de déploiement, Estimations de coûts infra, Risques techniques.

/bmad-brainstorming → Mode brainstorming ouvert : explore en profondeur, génère des idées, challenge les hypothèses, propose des alternatives créatives.

/bmad-party-mode → Débat contradictoire avec marqueurs [MARY — Business Analyst], [JOHN — Product Manager], [SALLY — UX Designer], [WINSTON — Architecte], puis [SYNTHÈSE] avec décision claire.

/bmad-bmm-review → Analyse critique du dernier livrable : lacunes, incohérences, risques non couverts, améliorations concrètes.

/bmad-checklist → Vérifie la complétude selon les standards BMAD. Score /10 avec items validés/à améliorer.

/bmad-status → Résume l'avancement : livrables produits, qualité, prochaines étapes recommandées.

/bmad-help → Liste toutes les commandes avec descriptions, organisées par phase.

RÈGLES : UNE seule question à la fois dans les flows. Les livrables commencent par # (titre markdown). Style adapté au secteur de l'utilisateur.`;

// ── GROUPES DE COMMANDES ──────────────────────────────────────────────
const CMD_GROUPS = [
  {
    id: 'discovery', label: 'Discovery', color: '#2563EB', soft: '#EFF6FF', mid: '#BFDBFE',
    commands: [
      {cmd:'/bmad-bmm-create-product-brief', icon:'📋', label:'Product Brief',    desc:'Créer un brief structuré complet'},
      {cmd:'/bmad-brainstorming',            icon:'💡', label:'Brainstorming',    desc:'Explorer le problème en profondeur'},
    ]
  },
  {
    id: 'planning', label: 'Planning', color: '#7C3AED', soft: '#F5F3FF', mid: '#DDD6FE',
    commands: [
      {cmd:'/bmad-bmm-create-prd',           icon:'📄', label:'PRD',              desc:'Product Requirements Document complet'},
    ]
  },
  {
    id: 'design', label: 'UX Design', color: '#059669', soft: '#ECFDF5', mid: '#A7F3D0',
    commands: [
      {cmd:'/bmad-bmm-create-ux-design',     icon:'🎨', label:'Design UX',        desc:'Parcours utilisateurs & interfaces'},
    ]
  },
  {
    id: 'architecture', label: 'Architecture', color: '#D97706', soft: '#FFFBEB', mid: '#FDE68A',
    commands: [
      {cmd:'/bmad-bmm-create-architecture',  icon:'🏗️', label:'Architecture Tech.', desc:'Architecture système complète'},
    ]
  },
  {
    id: 'utilities', label: 'Utilitaires', color: '#64748B', soft: '#F8FAFC', mid: '#CBD5E1',
    commands: [
      {cmd:'/bmad-party-mode',               icon:'🎉', label:'Party Mode',       desc:'Débat contradictoire multi-agents'},
      {cmd:'/bmad-bmm-review',               icon:'🔍', label:'Réviser',          desc:'Critique et améliore le livrable'},
      {cmd:'/bmad-checklist',                icon:'✅', label:'Checklist',         desc:'Valider la complétude'},
      {cmd:'/bmad-status',                   icon:'📊', label:'Statut projet',    desc:'Résumé de toutes les phases'},
      {cmd:'/bmad-help',                     icon:'❓', label:'Aide BMAD',        desc:'Toutes les commandes disponibles'},
    ]
  }
];

const ALL_CMDS = CMD_GROUPS.flatMap(g => g.commands);

// ── AUTOCOMPLETE ──────────────────────────────────────────────────────
let acIndex = -1, acFiltered = [];

function handleAutocomplete(val) {
  const ac = document.getElementById('autocomplete');
  if (!val.startsWith('/')) { ac.classList.remove('show'); return; }
  const q = val.toLowerCase();
  acFiltered = ALL_CMDS.filter(c => c.cmd.startsWith(q) || c.label.toLowerCase().includes(q.slice(1)));
  if (!acFiltered.length) { ac.classList.remove('show'); return; }
  acIndex = -1;
  let html = '<div class="ac-header">Commandes BMAD</div>';
  acFiltered.forEach((c, i) => {
    html += `<div class="ac-item" data-i="${i}" onclick="pickAc(${i})">
      <span>${c.icon}</span>
      <span class="ac-cmd">${c.cmd}</span>
      <span class="ac-desc">${c.desc}</span>
    </div>`;
  });
  ac.innerHTML = html;
  ac.classList.add('show');
}

function pickAc(i) {
  if (acFiltered[i]) {
    document.getElementById('userInput').value = acFiltered[i].cmd;
    document.getElementById('autocomplete').classList.remove('show');
    document.getElementById('userInput').focus();
  }
}

function toggleSlashMenu() {
  const inp = document.getElementById('userInput');
  if (!inp.value.startsWith('/')) inp.value = '/';
  handleAutocomplete(inp.value);
  inp.focus();
}

function handleAcKey(e) {
  const ac = document.getElementById('autocomplete');
  if (!ac.classList.contains('show')) return false;
  const items = ac.querySelectorAll('.ac-item');
  if (e.key === 'ArrowDown') { e.preventDefault(); acIndex = Math.min(acIndex+1, items.length-1); items.forEach((el,i) => el.classList.toggle('sel', i===acIndex)); return true; }
  if (e.key === 'ArrowUp')   { e.preventDefault(); acIndex = Math.max(acIndex-1, -1); items.forEach((el,i) => el.classList.toggle('sel', i===acIndex)); return true; }
  if (e.key === 'Tab' || e.key === 'Enter') { e.preventDefault(); pickAc(acIndex>=0?acIndex:0); if(e.key==='Enter') sendMessage(); return true; }
  if (e.key === 'Escape') { ac.classList.remove('show'); return true; }
  return false;
}

// ── RENDER SIDEBAR ────────────────────────────────────────────────────
function renderCmds(filter) {
  const q = (filter || '').toLowerCase();
  const el = document.getElementById('cmdsList');
  let h = '';
  CMD_GROUPS.forEach(group => {
    const cmds = q
      ? group.commands.filter(c => c.label.toLowerCase().includes(q) || c.cmd.includes(q) || c.desc.toLowerCase().includes(q))
      : group.commands;
    if (!cmds.length) return;
    h += `<div class="cmd-section">
      <div class="cmd-group-header">
        <span class="cmd-group-dot" style="background:${group.color}"></span>
        <span class="cmd-section-title">${group.label}</span>
      </div>`;
    cmds.forEach(c => {
      h += `<button class="cmd-btn" onclick="sendQuick('${c.cmd}')">
        <span class="cmd-icon">${c.icon}</span>
        <span class="cmd-body">
          <span class="cmd-label">${c.label}</span>
          <span class="cmd-slash">${c.cmd}</span>
        </span>
      </button>`;
    });
    h += '</div>';
  });
  el.innerHTML = h || '<div style="padding:20px 16px;color:var(--text3);font-size:12px;text-align:center">Aucune commande trouvée</div>';
}

function filterCmds(val) { renderCmds(val); }

// ── MESSAGES ──────────────────────────────────────────────────────────
function renderMessages() {
  const msgs = document.getElementById('messages');
  if (!msgs) return;
  if (conversation.length === 0) {
    msgs.innerHTML = `<div class="welcome">
      <div class="welcome-avatar" style="background:var(--accent-soft);border-color:var(--accent-mid)">⚡</div>
      <h2>BMAD Studio</h2>
      <p>Sélectionnez une commande dans le panel gauche ou tapez <code style="font-family:'Geist Mono',monospace;background:var(--surface2);padding:1px 5px;border-radius:3px;border:1px solid var(--border2)">/bmad</code> pour commencer.</p>
      <div class="chips">
        <div class="chip" onclick="sendQuick('/bmad-bmm-create-product-brief')">📋 Product Brief</div>
        <div class="chip" onclick="sendQuick('/bmad-brainstorming')">💡 Brainstorming</div>
        <div class="chip" onclick="sendQuick('/bmad-bmm-create-prd')">📄 PRD</div>
        <div class="chip" onclick="sendQuick('/bmad-party-mode')">🎉 Party Mode</div>
      </div>
    </div>`;
    return;
  }
  msgs.innerHTML = '';
  conversation.forEach(m => {
    msgs.appendChild(m.role === 'user' ? makeUserMsg(m.content) : makeAgentMsg(m.content));
  });
  msgs.scrollTop = msgs.scrollHeight;
}

function makeUserMsg(text) {
  const d = document.createElement('div');
  d.className = 'msg user';
  d.innerHTML = `<div class="msg-avatar">👤</div>
    <div class="msg-body"><div class="msg-name">Vous</div><div class="msg-text">${esc(text)}</div></div>`;
  return d;
}

function makeAgentMsg(text) {
  const d = document.createElement('div');
  d.className = 'msg agent';
  d.innerHTML = `<div class="msg-avatar" style="background:var(--accent-soft);border-color:var(--accent-mid)">⚡</div>
    <div class="msg-body"><div class="msg-name">BMAD Studio</div><div class="msg-text">${fmt(text)}</div></div>`;
  return d;
}

function renderPanel() {
  const panel = document.getElementById('panelContent');
  const content = livrables.last;
  document.getElementById('panelTitle').textContent = 'Livrable';
  if (!content) {
    panel.innerHTML = '<div class="panel-empty"><div class="panel-empty-icon">📄</div><div class="panel-empty-title">Aucun livrable</div><div class="panel-empty-desc">Le livrable généré apparaîtra ici automatiquement.</div></div>';
    return;
  }
  let html = '';
  content.split('\n').forEach(line => {
    if (line.startsWith('# '))        html += `<div class="lv-h1">${esc(line.slice(2))}</div>`;
    else if (line.startsWith('## '))  html += `<div class="lv-h2">${esc(line.slice(3))}</div>`;
    else if (line.startsWith('- ') || line.startsWith('• ')) html += `<div class="lv-bullet">${esc(line.slice(2))}</div>`;
    else if (line.trim())             html += `<div class="lv-p">${esc(line)}</div>`;
    else html += '<div style="height:6px"></div>';
  });
  panel.innerHTML = html;
}

// ── INPUT ─────────────────────────────────────────────────────────────
function handleKey(e) {
  if (handleAcKey(e)) return;
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}
function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 160) + 'px'; }
function sendQuick(text) {
  document.getElementById('autocomplete').classList.remove('show');
  document.getElementById('userInput').value = text;
  sendMessage();
}

// ── SEND ──────────────────────────────────────────────────────────────
async function sendMessage() {
  const inp = document.getElementById('userInput');
  const text = inp.value.trim();
  if (!text || isLoading) return;
  inp.value = ''; inp.style.height = 'auto';
  document.getElementById('autocomplete').classList.remove('show');
  conversation.push({ role: 'user', content: text });
  renderMessages();
  isLoading = true;
  document.getElementById('sendBtn').disabled = true;
  const msgs = document.getElementById('messages');
  const typingEl = document.createElement('div');
  typingEl.className = 'typing-row';
  typingEl.innerHTML = `<div class="msg-avatar" style="background:var(--accent-soft);border-color:var(--accent-mid)">⚡</div>
    <div class="typing"><span></span><span></span><span></span></div>`;
  msgs.appendChild(typingEl);
  msgs.scrollTop = msgs.scrollHeight;
  try {
    const hist = conversation.slice(0, -1);
    const res = await fetch('/api/anthropic', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': 'PROXY_MANAGED' },
      body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 2500, system: SYSTEM_PROMPT, messages: hist.concat([{ role: 'user', content: text }]) })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || 'API error');
    const reply = data.content.map(b => b.text || '').join('');
    conversation.push({ role: 'assistant', content: reply });
    if (reply.startsWith('#') || (reply.length > 350 && reply.includes('\n## '))) {
      livrables.last = reply;
      if (text.includes('create-product-brief')) livrables.brief = reply;
      else if (text.includes('create-prd'))       livrables.prd = reply;
      else if (text.includes('create-ux-design')) livrables.ux = reply;
      else if (text.includes('create-architecture')) livrables.architecture = reply;
    }
  } catch(e) {
    conversation.push({ role: 'assistant', content: `❌ Erreur : ${e.message}` });
  }
  typingEl.remove();
  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
  renderMessages();
  renderPanel();
}

// ── UTILS ─────────────────────────────────────────────────────────────
function esc(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>'); }
function fmt(t) { let s = esc(t); s = s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>'); s = s.replace(/\*(.+?)\*/g,'<em>$1</em>'); return s; }

// ── EXPORTS ───────────────────────────────────────────────────────────
function exportTxt() {
  const c = livrables.last; if (!c) return;
  const a = document.createElement('a');
  a.href = 'data:text/plain;charset=utf-8,' + encodeURIComponent(c);
  a.download = `BMAD_livrable_${new Date().toISOString().slice(0,10)}.txt`;
  a.click();
}
function exportPdf() {
  const c = livrables.last; if (!c) return;
  const win = window.open('', '_blank');
  let body = '';
  c.split('\n').forEach(line => {
    if (line.startsWith('# '))      body += `<h1>${line.slice(2)}</h1>`;
    else if (line.startsWith('## '))body += `<h2>${line.slice(3)}</h2>`;
    else if (line.startsWith('- ')) body += `<li>${line.slice(2)}</li>`;
    else if (line.trim())           body += `<p>${line}</p>`;
  });
  const css = 'body{font-family:system-ui,sans-serif;max-width:800px;margin:40px auto;color:#111;font-size:14px;line-height:1.6;}h1{font-size:20px;color:#4F46E5;border-bottom:2px solid #4F46E5;padding-bottom:6px;margin-bottom:14px;}h2{font-size:12px;color:#6B7280;text-transform:uppercase;letter-spacing:.06em;margin:16px 0 6px;}p{margin:5px 0;color:#374151;}li{margin:3px 0;color:#374151;}@media print{body{margin:20px;}}';
  win.document.write('<!DOCTYPE html><html><head><meta charset="UTF-8"><title>BMAD — Livrable</title><style>' + css + '</style></head><body>' + body + '</body></html>');
  win.document.close();
  setTimeout(() => win.print(), 400);
}
function copyLivrable() { const c = livrables.last; if (c) navigator.clipboard.writeText(c).catch(() => {}); }
function clearLivrable() { livrables.last = ''; renderPanel(); }
function saveApiKey() { /* key managed server-side */ }

// ── INIT ──────────────────────────────────────────────────────────────
renderCmds();
renderMessages();
renderPanel();
</script>
</body>
</html>
